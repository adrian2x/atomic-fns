name: Publish
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
env:
  # An exact Node release pins the bundled npm; trusted publishing needs npm 11.5.1 or later.
  NODE_VERSION: 26.13.1
  DENO_VERSION: 2.9.6
jobs:
  check:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ syntax.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Match the tag to the package version
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release.ts tag
  pack:
    needs: [release, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      script_sha256: ${{ steps.pack.outputs.script_sha256 }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack and record the tarball hash
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          cp scripts/release.ts "$RUNNER_TEMP/package/release.ts"
          tarball=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package" | jq -er 'if type == "array" then .[0].filename else .["atomic-fns"].filename end')
          sha256=$(sha256sum "$RUNNER_TEMP/package/$tarball" | cut -d' ' -f1)
          {
            echo "tarball=$tarball"
            echo "sha256=$sha256"
            echo "script_sha256=$(sha256sum "$RUNNER_TEMP/package/release.ts" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
  npm:
    needs: [release, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
      SCRIPT_SHA256: ${{ needs.pack.outputs.script_sha256 }}
      TARBALL: ${{ needs.pack.outputs.tarball }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Require npm 11.5.1 or later
        run: |
          npm -v
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm -v)"
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Verify and publish the tarball
        run: |
          echo "$SCRIPT_SHA256  $RUNNER_TEMP/package/release.ts" | sha256sum --check --strict
          node "$RUNNER_TEMP/package/release.ts" publish
  jsr:
    needs: [release, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno publish --set-version "$VERSION"
