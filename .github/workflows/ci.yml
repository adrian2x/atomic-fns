name: CI
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build && npm pack && cd consumer && npm i --no-save ../atomic-fns-2.0.0.tgz typescript@~6.0.3 @types/node@^24 && npx tsc -p tsconfig.json
