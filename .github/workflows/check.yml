name: Check
on:
  workflow_call:
permissions: {}
jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ github.event_name != 'release' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
  consumer:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript: [6.0.3, 7.0.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'release' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:consumer
        env:
          CONSUMER_TYPESCRIPT: ${{ matrix.typescript }}
  jsr:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: npm run jsr
  workflows:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false
          mise_toml: |
            [tools]
            actionlint = "1.7.12"
            zizmor = "1.32.0"
      - run: actionlint -color
      - run: zizmor --offline --no-progress .github/workflows
